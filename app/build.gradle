apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def env = { String key -> System.getenv(key) ?: localProperties.getProperty(key) }
def mapsApiKey = env('MAPS_API_KEY') ?: ''
def keystorePath = env('KEYSTORE_FILE')
def hasReleaseKey = keystorePath && file(keystorePath).exists()

android {
    namespace 'app.simple.positional'
    compileSdk = 37

    defaultConfig {
        applicationId 'app.simple.positional'
        minSdk = 24
        targetSdk = 37
        versionCode = (env('VERSION_CODE') ?: '20260512') as int
        versionName = env('VERSION_NAME') ?: 'v2026.05.12'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]
        resValue 'string', 'versionName', versionName
        buildConfigField 'boolean', 'HAS_MAPS_KEY', mapsApiKey.isEmpty() ? 'false' : 'true'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/databases/schemas")
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword env('STORE_PASSWORD')
                keyAlias env('KEY_ALIAS')
                keyPassword env('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '_debug'
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = 'JVM_21'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
        resValues true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.glance:glance-appwidget:1.1.1'

    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'

    implementation 'org.shredzone.commons:commons-suncalc:3.11'
    implementation 'com.github.kylecorry31:Geo-Coordinate-Conversion-Java:360781e5be'

    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}
